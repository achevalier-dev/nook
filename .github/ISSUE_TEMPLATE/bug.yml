name: Bug
description: A command did the wrong thing.
title: "nook <command>: "
labels: ["bug"]
body:
  - type: input
    id: command
    attributes:
      label: The command
      description: Exactly what you ran.
      placeholder: nook attach
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: nook doctor
      description: >
        It names the box's tailnet address and hostname — replace them if you
        would rather not publish them.
      render: text
    validations:
      required: true

  - type: input
    id: transport
    attributes:
      label: Transport
      description: iSCSI or NBD — `nook status` says which, and the two fail differently.

  - type: textarea
    id: box-side
    attributes:
      label: Anything from the box
      description: >
        `nook ssh` then `journalctl -u nbd-server -n 50` for a drive on NBD,
        `targetcli ls` for one on iSCSI, or `nook logs` for a service.
      render: text
