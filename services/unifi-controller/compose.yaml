services:
  unifi-controller:
    image: linuxserver/unifi-controller:8.0.7
    restart: unless-stopped
    ports: ["${NOOK_TS_IP}:8383:8080"]
    volumes:
      - ${NOOK_DATA}/apps/unifi-controller/config:/config
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
