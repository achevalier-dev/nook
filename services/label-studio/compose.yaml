services:
  label-studio:
    image: heartexlabs/label-studio:1.23.0
    restart: unless-stopped
    ports: ["${NOOK_TS_IP}:3082:8080"]
    volumes:
      - ${NOOK_DATA}/apps/label-studio/data:/label-studio/data
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
