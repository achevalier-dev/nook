services:
  lyrionmusicserver:
    image: lmscommunity/lyrionmusicserver:9.1.1
    restart: unless-stopped
    ports: ["${NOOK_TS_IP}:9000:9000"]
    volumes:
      - ${NOOK_DATA}/apps/lyrionmusicserver/config:/config
      - ${NOOK_DATA}/apps/lyrionmusicserver/playlists:/playlist
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
