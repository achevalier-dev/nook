<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{HOST}}</title>
<style>
  /* Warm phosphor on near-black. A box in a cupboard should look like a box in
     a cupboard — an instrument you glance at — not like a SaaS dashboard. */
  :root {
    --ink: #efe6d6;
    --dim: #8a8072;
    --faint: #5c5449;
    --glow: #f2b45c;
    --live: #86d08a;
    --bg: #100e0c;
    --card: #191613;
    --edge: #262119;
    --shadow: 0 1px 0 #ffffff08 inset, 0 12px 30px -18px #000;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ink: #1e1913; --dim: #6d6459; --faint: #9a9086; --glow: #b06f10;
      --live: #2f7d3a; --bg: #f4f0e7; --card: #fffdf7; --edge: #e3dbca;
      --shadow: 0 1px 0 #fff inset, 0 12px 30px -20px #0003;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 3rem 1.5rem;
    background: var(--bg);
    /* A warm bloom above the machine's name, so the page has a light source. */
    background-image:
      radial-gradient(60rem 34rem at 50% -14rem, #f2b45c1f, transparent 70%),
      radial-gradient(40rem 24rem at 50% 120%, #ffffff08, transparent 70%);
    color: var(--ink);
    font: 15px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }
  /* Scanlines, barely there. Enough to read as a screen rather than a document. */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(180deg, #fff0 0 2px, #0000000f 2px 3px);
    opacity: .5;
  }
  main { width: 100%; max-width: 45rem; }

  /* ── the machine ─────────────────────────────────────────────────────── */
  .hero { text-align: center; margin-bottom: 3rem; }
  h1 {
    margin: 0; font-size: clamp(2.6rem, 9vw, 4rem); font-weight: 700;
    letter-spacing: -.045em; line-height: 1;
    text-shadow: 0 0 3.5rem #f2b45c40;
  }
  .status {
    margin-top: 1rem; display: inline-flex; align-items: center; gap: .6rem;
    padding: .4rem .9rem .4rem .75rem;
    border: 1px solid var(--edge); border-radius: 2rem; background: var(--card);
    font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
  }
  .lamp {
    width: .45rem; height: .45rem; border-radius: 50%;
    background: var(--live); box-shadow: 0 0 .6rem var(--live);
    animation: breathe 4.5s ease-in-out infinite;
  }
  .lamp.cold { background: var(--faint); box-shadow: none; animation: none; }
  @keyframes breathe { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }
  .tagline { color: var(--faint); margin: .9rem 0 0; font-size: .84rem; }

  /* ── vitals ──────────────────────────────────────────────────────────── */
  .vitals {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
    gap: .8rem; margin-bottom: 2.75rem;
  }
  .dial {
    background: var(--card); border: 1px solid var(--edge);
    border-radius: .75rem; padding: 1rem 1.05rem 1.1rem; box-shadow: var(--shadow);
  }
  .k { color: var(--faint); font-size: .64rem; letter-spacing: .18em; text-transform: uppercase; }
  .v {
    font-size: 1.9rem; line-height: 1.15; margin-top: .3rem;
    font-variant-numeric: tabular-nums; letter-spacing: -.03em;
  }
  .v small { font-size: .78rem; color: var(--dim); letter-spacing: 0; margin-left: .2rem; }
  /* Ticks make it an instrument. A plain bar makes it a progress indicator,
     which is a different and more anxious thing. */
  .meter { position: relative; height: .38rem; margin-top: .8rem; background: #0007; border-radius: 1rem; overflow: hidden; }
  .meter i {
    position: absolute; inset: 0 100% 0 0; border-radius: 1rem;
    background: linear-gradient(90deg, #f2b45c99, var(--glow));
    box-shadow: 0 0 .7rem #f2b45c66;
    transition: right 1.4s cubic-bezier(.2, .8, .2, 1);
  }
  .meter u { position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, #0000 0 calc(12.5% - 1px), var(--card) calc(12.5% - 1px) 12.5%); }

  /* ── services ────────────────────────────────────────────────────────── */
  h2 { font-size: .64rem; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); margin: 0 0 .85rem; font-weight: 500; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: .6rem; }
  li a {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center;
    column-gap: .9rem; row-gap: .2rem;
    padding: 1rem 1.15rem; background: var(--card);
    border: 1px solid var(--edge); border-radius: .75rem;
    color: inherit; text-decoration: none; box-shadow: var(--shadow);
    transition: border-color .2s, transform .2s, box-shadow .2s;
  }
  li a:hover {
    border-color: #f2b45c66; transform: translateY(-2px);
    box-shadow: var(--shadow), 0 0 0 4px #f2b45c12;
  }
  li a:active { transform: translateY(0); }
  /* Every child placed explicitly: one `grid-column` on its own turns
     auto-flow off for the rest and the row comes out inside out. */
  .pip { grid-area: 1 / 1 / 3 / 2; align-self: center; width: .4rem; height: .4rem; border-radius: 50%; background: var(--live); box-shadow: 0 0 .5rem var(--live); }
  .name { grid-area: 1 / 2 / 2 / 3; font-weight: 700; letter-spacing: -.01em; }
  .what { grid-area: 2 / 2 / 3 / 3; color: var(--faint); font-size: .8rem; }
  .go { grid-area: 1 / 3 / 3 / 4; align-self: center; color: var(--faint); transition: color .2s, transform .2s; }
  li a:hover .go { color: var(--glow); transform: translateX(3px); }
  .empty { color: var(--dim); padding: 1.15rem; border: 1px dashed var(--edge); border-radius: .75rem; text-align: center; }
  .empty code { color: var(--glow); }

  footer {
    margin-top: 2.75rem; padding-top: 1.1rem; border-top: 1px solid var(--edge);
    color: var(--faint); font-size: .72rem;
    display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  }
  footer a { color: var(--dim); text-decoration: none; border-bottom: 1px solid var(--edge); }
  footer a:hover { color: var(--glow); }
  @media (prefers-reduced-motion: reduce) { *, body::after { animation: none !important; transition: none !important; } }
</style>

<main>
  <div class="hero">
    <h1>{{HOST}}</h1>
    <div class="status"><span class="lamp cold" id="lamp"></span><span id="uptime">no answer</span></div>
    <p class="tagline">a small computer, somewhere you left it</p>
  </div>

  <div class="vitals">
    <div class="dial">
      <div class="k">temperature</div>
      <div class="v"><span id="temp">—</span><small>°C</small></div>
      <div class="meter"><i id="tempbar"></i><u></u></div>
    </div>
    <div class="dial">
      <div class="k">load</div>
      <div class="v" id="load">—</div>
      <div class="meter"><i id="loadbar"></i><u></u></div>
    </div>
    <div class="dial">
      <div class="k">disk free</div>
      <div class="v"><span id="free">—</span></div>
      <div class="meter"><i id="diskbar"></i><u></u></div>
    </div>
    <div class="dial">
      <div class="k">containers</div>
      <div class="v" id="containers">—</div>
      <div class="meter"><i id="drivebar"></i><u></u></div>
    </div>
  </div>

  <h2>services</h2>
  <ul>{{ROWS}}</ul>

  <footer>
    <span>kept by <a href="https://github.com/achevalier-dev/nook">nook</a></span>
    <span id="stamp">reading…</span>
  </footer>
</main>

<script>
  // Optional by design: with no status.json this is still the list of links it
  // was before, which is the point of it being a static file on a small box.
  const $ = id => document.getElementById(id);
  const human = b => {
    const u = ['B', 'K', 'M', 'G', 'T'];
    let i = 0, v = b || 0;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (v >= 10 ? Math.round(v) : v.toFixed(1)) + u[i];
  };
  const fill = (el, frac) => { el.style.right = (100 - Math.max(0, Math.min(1, frac)) * 100) + '%'; };

  async function read() {
    try {
      const s = await (await fetch('status.json?t=' + Date.now(), { cache: 'no-store' })).json();
      $('lamp').classList.remove('cold');
      $('uptime').textContent = 'up ' + (s.uptime || '');
      $('temp').textContent = s.temp ? s.temp.toFixed(1) : '—';
      // 30–85°C is the range one of these actually lives in; outside it is news.
      fill($('tempbar'), ((s.temp || 0) - 30) / 55);
      $('load').textContent = (s.load ?? 0).toFixed(2);
      fill($('loadbar'), (s.load || 0) / 4);
      $('free').textContent = human(s.disk?.avail);
      fill($('diskbar'), (s.disk?.used || 0) / (s.disk?.size || 1));
      $('containers').textContent = s.containers ?? '—';
      fill($('drivebar'), Math.min(1, (s.containers || 0) / 8));
      $('stamp').textContent = 'read at ' + new Date().toLocaleTimeString();
    } catch {
      $('lamp').classList.add('cold');
      $('uptime').textContent = 'no answer';
      $('stamp').textContent = 'no vitals — the box may be resting';
    }
  }
  read();
  setInterval(read, 20000);
  // Coming back to a tab should not show a minute-old temperature.
  document.addEventListener('visibilitychange', () => !document.hidden && read());
</script>
