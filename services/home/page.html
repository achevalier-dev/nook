<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{HOST}}</title>
<style>
  /* An instrument binnacle: neutral black, white ticks, a red needle, and the
     services set below it like a contents page rather than a grid of cards. */
  :root {
    --ink: #f2f1ee;
    --dim: #8f8d88;
    --faint: #56544f;
    --rule: #232326;
    --bezel: #131315;
    --amber: #f0a53c;
    --red: #ff4b34;
    --live: #6ee787;
    --bg: #08080a;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ink: #16161a; --dim: #5f5d59; --faint: #a3a19b; --rule: #dedcd6;
      --bezel: #fbfaf7; --amber: #b5730c; --red: #cc2f18; --live: #1f7a37;
      --bg: #f2f1ec;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; padding: clamp(2.5rem, 6vw, 4.5rem) 1.5rem 3rem;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }
  /* Fixed, so the light behind the cluster does not stop where the content
     does and leave a seam across the page. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(42rem 26rem at 50% 22%, #ffffff0a, transparent 70%);
  }
  main { max-width: 46rem; margin: 0 auto; }

  /* ── masthead ────────────────────────────────────────────────────────── */
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1.5rem; }
  h1 {
    margin: 0; font-size: clamp(2.6rem, 7.5vw, 3.6rem); line-height: .95;
    /* A serif over a monospace body: the one typographic surprise here. */
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-weight: 600; letter-spacing: -.025em;
  }
  .meta { margin: .85rem 0 0; color: var(--dim); font-size: .78rem; }
  .meta b { font-weight: 400; color: var(--ink); }
  .meta .sep { color: var(--faint); margin: 0 .5rem; }
  .lamp {
    display: inline-block; width: .42rem; height: .42rem; border-radius: 50%;
    background: var(--live); box-shadow: 0 0 .55rem var(--live);
    margin-right: .45rem; vertical-align: .05em;
    animation: breathe 4.5s ease-in-out infinite;
  }
  .lamp.cold { background: var(--faint); box-shadow: none; animation: none; }
  @keyframes breathe { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }

  button {
    font: inherit; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--dim); background: none; border: 1px solid var(--rule);
    padding: .5rem .85rem; border-radius: .3rem; cursor: pointer; white-space: nowrap;
    transition: color .18s, border-color .18s;
  }
  button:hover { color: var(--amber); border-color: var(--amber); }
  button:disabled { cursor: default; opacity: .6; }

  /* ── the cluster ─────────────────────────────────────────────────────── */
  .cluster {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    gap: 1rem; margin: 2.5rem 0;
  }
  .g { text-align: center; }
  .g svg { width: 100%; max-width: 10rem; display: block; margin: 0 auto; }
  .track { fill: none; stroke: var(--rule); stroke-width: 3.5; stroke-linecap: round; }
  .redline { fill: none; stroke: var(--red); stroke-width: 3.5; opacity: .32; stroke-linecap: butt; }
  .fill {
    fill: none; stroke: var(--amber); stroke-width: 3.5; stroke-linecap: round;
    filter: drop-shadow(0 0 3px #f0a53c66);
    transition: stroke-dasharray 1.2s cubic-bezier(.2, .8, .2, 1), stroke .6s;
  }
  .fill.hot { stroke: var(--red); filter: drop-shadow(0 0 4px #ff4b3488); }
  .tick { stroke: var(--dim); stroke-width: 1; opacity: .7; }
  .tick.major { stroke: var(--ink); stroke-width: 1.7; opacity: .9; }
  .needle {
    stroke: var(--red); stroke-width: 2; stroke-linecap: round;
    transition: transform 1.2s cubic-bezier(.34, 1.3, .5, 1);
    /* No transform-origin here on purpose: the rotate() attribute already
       carries its own centre, and a CSS origin is applied on top of it, which
       pivots the needle off the dial. */
    filter: drop-shadow(0 0 3px #ff4b3466);
  }
  .hub { fill: var(--bezel); stroke: var(--rule); stroke-width: 1.5; }
  .read { font-size: 1.4rem; margin-top: -.35rem; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .read small { font-size: .68rem; color: var(--faint); margin-left: .12rem; }
  .lbl { color: var(--faint); font-size: .6rem; letter-spacing: .2em; text-transform: uppercase; margin-top: .35rem; }

  hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }

  /* ── services, set as a contents page ───────────────────────────────── */
  h2 { font-size: .6rem; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); margin: 0 0 1rem; font-weight: 400; }
  ol { list-style: none; padding: 0; margin: 0; }
  ol li { padding: .55rem 0; border-bottom: 1px solid var(--rule); }
  ol li:first-child { border-top: 1px solid var(--rule); }
  .line { display: flex; align-items: baseline; gap: .55rem; text-decoration: none; color: inherit; }
  .num { color: var(--faint); font-size: .72rem; min-width: 1.4rem; }
  .nm { font-weight: 600; letter-spacing: -.01em; }
  /* The leader is drawn, not typed, so it fills whatever room is left. */
  .dots { flex: 1; align-self: center; height: 1px; margin: 0 .2rem;
          background-image: radial-gradient(circle, var(--faint) .5px, transparent .6px);
          background-size: 6px 1px; }
  .pt { color: var(--dim); font-variant-numeric: tabular-nums; font-size: .85rem; }
  .go { color: var(--faint); transition: color .18s, transform .18s; }
  .what { margin: .15rem 0 .1rem 1.95rem; color: var(--faint); font-size: .78rem; }
  .line:hover .nm { color: var(--amber); }
  .line:hover .go { color: var(--amber); transform: translate(2px, -2px); }
  li.stopped { opacity: .4; }
  li.stopped .line { pointer-events: none; }
  li.stopped .pt::after { content: " stopped"; color: var(--faint); }
  .empty { color: var(--dim); padding: 1rem 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .empty code { color: var(--amber); }

  footer { margin-top: 2.5rem; color: var(--faint); font-size: .72rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  footer a { color: var(--dim); text-decoration: none; border-bottom: 1px solid var(--rule); }
  footer a:hover { color: var(--amber); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<main id="sheet">
  <div class="top">
    <div>
      <h1>{{HOST}}</h1>
      <p class="meta">
        <span class="lamp cold" id="lamp"></span><span id="uptime">no answer</span>
        <span class="sep">/</span><b id="model">a small computer, somewhere you left it</b>
      </p>
    </div>
    <button id="share" title="Copy a picture of this page">share</button>
  </div>

  <div class="cluster" id="cluster">
    <div class="g" data-gauge="temp" data-redline=".78"><div class="read"><span>—</span><small>°C</small></div><div class="lbl">temperature</div></div>
    <div class="g" data-gauge="load" data-redline=".75"><div class="read"><span>—</span></div><div class="lbl">load</div></div>
    <div class="g" data-gauge="disk" data-redline=".85"><div class="read"><span>—</span></div><div class="lbl">disk</div></div>
    <div class="g" data-gauge="cont" data-redline="1"><div class="read"><span>—</span></div><div class="lbl">containers</div></div>
  </div>

  <hr>

  <h2>services</h2>
  <ol id="list">{{ROWS}}</ol>

  <footer>
    <span>kept by <a href="https://github.com/achevalier-dev/nook">nook</a></span>
    <span id="stamp">reading…</span>
  </footer>
</main>

<script>
  const $ = id => document.getElementById(id);

  // ── gauges ─────────────────────────────────────────────────────────────
  // 270° of sweep starting at the lower left, the way a tachometer reads.
  const A0 = 135, SWEEP = 270, R = 36, LEN = 2 * Math.PI * R * (SWEEP / 360);
  const pt = (deg, r) => [50 + r * Math.cos(deg * Math.PI / 180), 50 + r * Math.sin(deg * Math.PI / 180)];

  function arc(from, to, r) {
    const [x0, y0] = pt(from, r), [x1, y1] = pt(to, r);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${to - from > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  }

  for (const g of document.querySelectorAll('.g')) {
    const redline = parseFloat(g.dataset.redline);
    let ticks = '';
    // Eleven ticks, every fifth one long: enough to read a needle against
    // without turning the dial into a barcode.
    for (let i = 0; i <= 10; i++) {
      const a = A0 + (SWEEP * i) / 10;
      const [xa, ya] = pt(a, i % 5 === 0 ? 27 : 30), [xb, yb] = pt(a, 32.5);
      ticks += `<line class="tick${i % 5 === 0 ? ' major' : ''}" x1="${xa.toFixed(2)}" y1="${ya.toFixed(2)}" x2="${xb.toFixed(2)}" y2="${yb.toFixed(2)}"/>`;
    }
    g.insertAdjacentHTML('afterbegin',
      `<svg viewBox="0 0 100 100" aria-hidden="true">
         <path class="track" d="${arc(A0, A0 + SWEEP, R)}"/>
         <path class="redline" d="${arc(A0 + SWEEP * redline, A0 + SWEEP, R)}"/>
         <path class="fill" d="${arc(A0, A0 + SWEEP, R)}" stroke-dasharray="0 ${LEN.toFixed(1)}"/>
         ${ticks}
         <line class="needle" x1="50" y1="57" x2="50" y2="20" transform="rotate(225 50 50)"/>
         <circle class="hub" cx="50" cy="50" r="3.4"/>
       </svg>`);
  }

  function pose(g, f, hot) {
    const v = Math.max(0, Math.min(1, f || 0));
    g.querySelector('.fill').setAttribute('stroke-dasharray', `${(v * LEN).toFixed(1)} ${LEN.toFixed(1)}`);
    g.querySelector('.fill').classList.toggle('hot', !!hot);
    g.querySelector('.needle').setAttribute('transform', `rotate(${225 + v * SWEEP} 50 50)`);
  }

  function set(key, frac, text, hot) {
    const g = document.querySelector(`.g[data-gauge="${key}"]`);
    if (!g) return;
    pending[key] = [frac, text, hot];
    if (!ready) return;
    pose(g, frac, hot);
    g.querySelector('.read span').textContent = text;
  }

  // The needle sweep a car does when you turn the key: everything to the stop,
  // back to zero, then out to where it actually sits. It says the instrument is
  // live before there is anything to read on it.
  const gauges = [...document.querySelectorAll('.g')];
  const pending = {};
  let ready = false;

  function settle() {
    ready = true;
    for (const [key, args] of Object.entries(pending)) set(key, ...args);
  }

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    settle();
  } else {
    requestAnimationFrame(() => {
      gauges.forEach(g => pose(g, 1, true));
      setTimeout(() => gauges.forEach(g => pose(g, 0, false)), 900);
      setTimeout(settle, 1750);
    });
  }

  // ── vitals ─────────────────────────────────────────────────────────────
  const human = b => {
    const u = ['B', 'K', 'M', 'G', 'T'];
    let i = 0, v = b || 0;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (v >= 10 ? Math.round(v) : v.toFixed(1)) + u[i];
  };

  async function read() {
    try {
      const s = await (await fetch('status.json?t=' + Date.now(), { cache: 'no-store' })).json();
      $('lamp').classList.remove('cold');
      $('uptime').textContent = 'up ' + (s.uptime || '');
      if (s.model) $('model').textContent = s.model;

      // 30–85°C is the range one of these actually lives in; 73 is where it
      // starts throttling, which is what the redline marks.
      const t = s.temp || 0;
      set('temp', (t - 30) / 55, t ? t.toFixed(1) : '—', t >= 73);
      const l = s.load || 0;
      set('load', l / 4, l.toFixed(2), l >= 3);
      const used = (s.disk?.used || 0) / (s.disk?.size || 1);
      set('disk', used, human(s.disk?.avail) + ' free', used >= .85);
      set('cont', Math.min(1, (s.containers || 0) / 8), s.containers ?? '—');

      // A green dot that is always green is decoration. This one is reporting.
      if (Array.isArray(s.services)) {
        for (const li of document.querySelectorAll('#list li[data-name]')) {
          li.classList.toggle('stopped', !s.services.includes(li.dataset.name));
        }
      }
      $('stamp').textContent = 'read at ' + new Date().toLocaleTimeString();
    } catch {
      $('lamp').classList.add('cold');
      $('uptime').textContent = 'no answer';
      $('stamp').textContent = 'no vitals — the box may be resting';
    }
  }
  read();
  setInterval(read, 20000);
  // Coming back to a tab should not show a minute-old temperature.
  document.addEventListener('visibilitychange', () => !document.hidden && read());

  // ── share ──────────────────────────────────────────────────────────────
  // The page into a PNG, in the browser, with no library and nothing fetched.
  // It works only because everything here is inline: an <img> or a web font
  // inside a foreignObject would taint the canvas and toBlob would throw.
  const btn = $('share');
  const say = (t, ms = 2400) => { btn.textContent = t; setTimeout(() => (btn.textContent = 'share'), ms); };

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    say('…', 60000);
    try {
      const sheet = $('sheet');
      const pad = 44, scale = 2;
      const w = sheet.offsetWidth + pad * 2, h = sheet.offsetHeight + pad * 2;

      const clone = sheet.cloneNode(true);
      clone.querySelector('#share')?.remove();
      const css = [...document.styleSheets]
        .flatMap(s => { try { return [...s.cssRules].map(r => r.cssText); } catch { return []; } })
        .join('\n');

      const body = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
      body.setAttribute('style', `padding:${pad}px;width:${w}px`);
      body.innerHTML = `<style>${css}</style>`;
      body.appendChild(clone);

      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">` +
        `<foreignObject width="100%" height="100%">` +
        new XMLSerializer().serializeToString(body) +
        `</foreignObject></svg>`;

      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      await img.decode();

      const c = document.createElement('canvas');
      c.width = w * scale; c.height = h * scale;
      const ctx = c.getContext('2d');
      // The SVG has no background of its own; without this the PNG is
      // transparent and looks broken anywhere that composites it on white.
      ctx.fillStyle = getComputedStyle(document.body).backgroundColor;
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0);

      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        say('copied');
      } catch {
        // Clipboard images need a secure context and a permission; saving is
        // the fallback that always works.
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${document.title}.png`;
        a.click();
        URL.revokeObjectURL(a.href);
        say('saved');
      }
    } catch (e) {
      say('could not', 3000);
      console.error(e);
    } finally {
      btn.disabled = false;
    }
  });
</script>
