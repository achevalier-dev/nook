services:
  deluge:
    image: linuxserver/deluge:2.2.0
    restart: unless-stopped
    ports: ["${NOOK_TS_IP}:8112:8112"]
    volumes:
      - ${NOOK_DATA}/apps/deluge/config:/config
      - ${NOOK_DATA}/files:/DATA
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
