services:
  turbodiffusion:
    image: icewhaletech/turbodiffusion:20260312
    restart: unless-stopped
    ports: ["${NOOK_TS_IP}:27860:7860"]
    volumes:
      - ${NOOK_DATA}/apps/turbodiffusion_nvidia/models:/workspace/TurboDiffusion/checkpoints_host
      - ${NOOK_DATA}/apps/turbodiffusion_nvidia/outputs:/workspace/TurboDiffusion/outputs
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
