services:
  smokeping:
    image: linuxserver/smokeping:2.9.0
    restart: unless-stopped
    ports: ["${NOOK_TS_IP}:10280:80"]
    volumes:
      - ${NOOK_DATA}/apps/smokeping/config:/config
      - ${NOOK_DATA}/apps/smokeping/data:/data
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
