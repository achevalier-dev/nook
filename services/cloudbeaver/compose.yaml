services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:26.0.5
    restart: unless-stopped
    ports: ["${NOOK_TS_IP}:8978:8978"]
    volumes:
      - ${NOOK_DATA}/apps/cloudbeaver/workspace:/opt/cloudbeaver/workspace
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
