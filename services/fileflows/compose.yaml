services:
  fileflows:
    image: revenz/fileflows:stable
    restart: unless-stopped
    ports: ["${NOOK_TS_IP}:19200:5000"]
    volumes:
      - ${NOOK_DATA}/apps/fileflows/data:/app/Data
      - ${NOOK_DATA}/apps/fileflows/logs:/app/Logs
      - ${NOOK_DATA}/apps/fileflows/common:/app/common
      - ${NOOK_DATA}/apps/fileflows/temp:/temp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
