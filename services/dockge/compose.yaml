services:
  dockge:
    image: louislam/dockge:1
    restart: unless-stopped
    ports: ["${NOOK_TS_IP}:5001:5001"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NOOK_DATA}/apps/dockge:/app/data
      - ${NOOK_DATA}/stacks:/opt/stacks
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks
