services:
  navidrome:
    image: deluan/navidrome:latest
    restart: unless-stopped
    ports: ["${NOOK_TS_IP}:4533:4533"]
    volumes:
      - ${NOOK_DATA}/apps/navidrome:/data
      - ${NOOK_DATA}/files/music:/music:ro
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      TZ: ${TZ:-UTC}
