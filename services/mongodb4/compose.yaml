services:
  mongodb4:
    image: mongo:4.4.22
    restart: unless-stopped
    ports: ["${NOOK_TS_IP}:27018:27017"]
    volumes:
      - ${NOOK_DATA}/apps/mongodb4/data/configdb:/data/configdb
      - ${NOOK_DATA}/apps/mongodb4/data/db:/data/db
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
