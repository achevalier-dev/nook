services:
  syncthing:
    image: linuxserver/syncthing:1.29.7
    restart: unless-stopped
    ports: ["${NOOK_TS_IP}:8384:8384"]
    volumes:
      - ${NOOK_DATA}/apps/syncthing/config:/config
      - ${NOOK_DATA}/files:/DATA
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
