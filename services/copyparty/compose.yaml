services:
  copyparty:
    image: icewhaletech/copyparty:1.20.13
    restart: unless-stopped
    ports: ["${NOOK_TS_IP}:29708:3923"]
    volumes:
      - ${NOOK_DATA}/apps/copyparty/w:/w
      - ${NOOK_DATA}/apps/copyparty/confg:/cfg
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
